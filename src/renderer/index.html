<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https:; frame-src https: http:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foxline</title>
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body class="theme-dark">
  <div id="app">
    <header class="titlebar">
      <div class="tabs-area">
        <div class="brand"><img class="brand-avatar" src="../../assets/foxline-avatar.png" alt="Foxline"/><span>Foxline</span></div>
        <div id="tabs" class="tabs"></div>
        <button id="newTabBtn" class="icon-btn add-tab" type="button" data-i18n-title="newTab" title="New tab">+</button>
      </div>
      <div class="window-controls">
        <button class="win-btn" data-win="minimize" type="button">—</button>
        <button class="win-btn" data-win="maximize" type="button">▢</button>
        <button class="win-btn close" data-win="close" type="button">✕</button>
      </div>
    </header>

    <div class="toolbar">
      <button id="backBtn" class="icon-btn nav-btn" type="button" data-i18n-title="back" title="Back">←</button>
      <button id="forwardBtn" class="icon-btn nav-btn" type="button" data-i18n-title="forward" title="Forward">→</button>
      <button id="reloadBtn" class="icon-btn" type="button" data-i18n-title="reload" title="Reload">↻</button>
      <button id="homeBtn" class="icon-btn" type="button" data-i18n-title="home" title="Home">⌂</button>
      <form id="addressForm" class="address-wrap">
        <div class="address-shell"><span class="address-brand">F</span><input id="addressInput" class="address" spellcheck="false" data-i18n-placeholder="addressPlaceholder" placeholder="Search or enter address" /></div>
        <button id="goBtn" class="go-btn" type="submit">Go</button>
      </form>
      <button id="bookmarkBtn" class="icon-btn" type="button" data-i18n-title="addBookmark" title="Bookmark">☆</button>
      <button id="downloadsBtn" class="icon-btn" type="button" data-i18n-title="downloads" title="Downloads">↓</button>
      <button id="menuBtn" class="icon-btn" type="button" data-i18n-title="menu" title="Menu">☰</button>
    </div>

    <div id="menu" class="menu hidden">
      <button data-action="new-tab" data-i18n="newTab">New tab</button>
      <button data-action="new-window" data-i18n="newWindow">New window</button>
      <button data-action="new-incognito" data-i18n="newIncognito">New incognito window</button>
      <hr/>
      <button data-action="bookmarks" data-i18n="bookmarks">Bookmarks</button>
      <button data-action="history" data-i18n="history">History</button>
      <button data-action="downloads" data-i18n="downloads">Downloads</button>
      <button data-action="settings" data-i18n="settings">Settings</button>
      <button data-action="about" data-i18n="whatsNew">What's new</button>
      <hr/>
      <button data-action="set-default" data-i18n="setDefault">Set as default browser</button>
    </div>

    <main id="content" class="content"></main>

    <aside id="downloadsPanel" class="panel hidden">
      <div class="panel-head"><h3 data-i18n="downloads">Downloads</h3><button class="icon-btn" data-close="downloadsPanel" type="button">✕</button></div>
      <div id="downloadsList" class="panel-body"></div>
    </aside>
  </div>
  <script src="i18n/i18n.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
